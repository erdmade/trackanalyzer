[build-system]
requires = ["setuptools>=82.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trackanalyzer"
dynamic = ["version"]
description = "A simple track analyzer for KML files"
authors = [{name="Dennys Erdtmann"}]
readme = "README.md"
requires-python = ">=3.13.7"
dependencies = ["folium"]

[tool.setuptools.packages.find]
where = ["src"]